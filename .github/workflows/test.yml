name: test

on:
  push:
  pull_request:

jobs:
  pytest-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: renaiss_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d renaiss_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RENAISS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/renaiss_test
      RENAISS_REQUIRE_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit and real PostgreSQL tests
        run: python -m pytest tests -q --postgres-integration
      - name: Check patch whitespace
        run: git diff --check
